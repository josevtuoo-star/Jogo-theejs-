# Gera o APK de Android a cada push, roda os testes de física antes e publica
# o resultado como Release do GitHub. Link direto, sempre da versão mais nova:
#   https://github.com/<dono>/<repo>/releases/latest/download/UltimoAmanhecer.apk
name: APK Android

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  # Prefixo da versão do jogo; o último número é o número da build.
  VERSION_PREFIX: "0.6"
  APK_NAME: UltimoAmanhecer.apk
  ZIP_NAME: UltimoAmanhecer.zip
  BUILD_TOOLS: "35.0.1"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot e dos templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Baixar Godot e templates de Android
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz "templates/android_*" "templates/version.txt" -d "$dest"
          rm -f /tmp/templates.tpz /tmp/godot.zip

      - name: Android SDK e configuração do editor
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;${BUILD_TOOLS}" > /dev/null
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Importar projeto
        run: ~/godot/godot --headless --path . --import

      - name: Testes de física (o APK só sai se todos passarem)
        run: ~/godot/godot --headless --path . --fixed-fps 60 res://tests/test_runner.tscn

      - name: Testes de animação, combate, interação e morte
        run: ~/godot/godot --headless --path . --fixed-fps 60 res://tests/animation_test_runner.tscn

      - name: Versão da build
        id: version
        run: |
          code=${{ github.run_number }}
          name="${VERSION_PREFIX}.${code}"
          sed -i "s/^version\/code=.*/version\/code=${code}/; s/^version\/name=.*/version\/name=\"${name}\"/" export_presets.cfg
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Usando a chave dos Secrets do repositório."
            echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${KEYSTORE_ALIAS}"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "Sem Secrets: usando a chave de teste export/android_teste.keystore."
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$GITHUB_WORKSPACE/export/android_teste.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=ultimoamanhecer"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=ultimoamanhecer"
            } >> "$GITHUB_ENV"
          fi

      - name: Exportar APK
        run: |
          set -euo pipefail
          mkdir -p builds/android
          ~/godot/godot --headless --path . --export-release "Android" "builds/android/${APK_NAME}"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify "builds/android/${APK_NAME}"
          # Cópia em .zip: alguns navegadores (Chrome no Android) seguram
          # downloads de .apk na verificação de segurança; .zip passa direto.
          (cd builds/android && zip -0 -j "${ZIP_NAME}" "${APK_NAME}")
          ls -la builds/android

      - name: Publicar Release com link direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.name }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          printf 'Build automática do branch `%s` (commit %s).\n\nTodos os testes de física passaram antes da exportação.\n\nDownload direto (sempre a versão mais nova):\n- APK: %s/%s\n- ZIP (se o navegador travar no APK; extraia e toque no APK): %s/%s\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" "$base" "${APK_NAME}" "$base" "${ZIP_NAME}" > "$RUNNER_TEMP/notes.md"
          # Conferência do download no celular: tamanho exato e SHA-256.
          {
            echo ""
            echo "Conferir o download (se o Android disser \"pacote inválido\", o arquivo chegou corrompido):"
            for f in "${APK_NAME}" "${ZIP_NAME}"; do
              echo "- \`${f}\`: $(stat -c %s "builds/android/${f}") bytes, SHA-256 \`$(sha256sum "builds/android/${f}" | cut -d' ' -f1)\`"
            done
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "builds/android/${APK_NAME}" "builds/android/${ZIP_NAME}" \
            --target "$GITHUB_SHA" \
            --title "Último Amanhecer ${tag}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          {
            echo "### APK publicado"
            echo ""
            echo "- APK: $base/${APK_NAME}"
            echo "- ZIP: $base/${ZIP_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
