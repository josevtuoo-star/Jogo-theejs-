name: Build APK Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (plataforma 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (release, assinado com a chave de teste)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verificar APK
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "package|sdkVersion|targetSdk"

      - uses: actions/upload-artifact@v4
        with:
          name: Sobrevivencia2x2-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
